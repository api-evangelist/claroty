openapi: 3.2.0
info:
  title: Claroty Authenticate API
  version: 1.0.0
  description: 'Operations tagged Authenticate across 2 of this provider''s published API definitions: claroty-jwthenticator-openapi.yaml, claroty-jwthenticator-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Authenticate
paths:
  /authenticate:
    post:
      description: Authenticate using a key.
      operationId: authenticate
      requestBody:
        description: Authentication credentials
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Authentication successfull
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              examples:
                succesfull_auth_response:
                  value:
