openapi: 3.2.0
info:
  title: Claroty Validate API
  version: 1.0.0
  description: 'Operations tagged Validate across 2 of this provider''s published API definitions: claroty-jwthenticator-openapi.yaml, claroty-jwthenticator-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Validate
paths:
  /validate:
    post:
      description: Validate refresh token
      operationId: validate
      requestBody:
        description: The JWT to validate
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JWTValidateRequest'
      responses:
        '200':
          description: JWT is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoolResponse'
              example:
                jwt_is_valid:
                  value:
                    success: true
                    message: null
        '400':
          description: Invalid request
        '401':
          description: JWT is invalid (bad signature, couldn't decode, or expired)
      tags:
      - Validate
      summary: Validate
      x-summary-source: derived
components:
  schemas:
    BoolResponse:
      type: object
      required:
      - result
      properties:
        result:
          type: boolean
        message:
          type: string
    JWTValidateRequest:
      type: object
      required:
      - jwt
      properties:
        jwt:
          type: string
          description: JWT to validate
x-refined-from:
- claroty-jwthenticator-openapi.yaml
- claroty-jwthenticator-openapi.yml
