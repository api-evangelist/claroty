openapi: 3.2.0
info:
  title: Claroty Jwks API
  version: 1.0.0
  description: 'Operations tagged Jwks across 2 of this provider''s published API definitions: claroty-jwthenticator-openapi.yaml, claroty-jwthenticator-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: JWKS
paths:
  /jwks:
    get:
      description: Get the industry standard JWKS (JSON Web Key Set) data.
      operationId: jwks
      responses:
        '200':
          description: The JWKS data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKSResponse'
              examples:
                example_jwks:
                  value:
                    e: AQAB
                    alg: RS256
                    use: sig
                    n: re5LAvt2PxauKMPvog6Pqv1P32UN1sTbPCPuHMowDSPycAwSpPjgvyp3Ttax7dhZZDSm_FnBJWzyvNJcSc5rN9H-TFgozzEnMaoDH6gE6xeUgIZ4NMvk5X_4DwLFVG3U8ziFa_LBv7lB4cN4iHkOjCRKCiN2Gy-Eji7E2JcEWTceOa7jy5gz8vcGEphiB8grn3bAYj6Iqvtle_OzCGaryonSuk2-PVewhMjLSFVK5jwcHMp6sgYme7k2c5lKClrgn7QDpWxN0GUWX4vx_CMnRt_76KCzfGCAOUk4LsCsBgfPJ2UwUifJ5wVA-MPSTWifyyqhL9iioqrnvtvZ-7GTyQ
                    x5c:
                    - '-----BEGIN PUBLIC KEY-----

                      MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAre5LAvt2PxauKMPvog6P

                      qv1P32UN1sTbPCPuHMowDSPycAwSpPjgvyp3Ttax7dhZZDSm/FnBJWzyvNJcSc5r

                      N9H+TFgozzEnMaoDH6gE6xeUgIZ4NMvk5X/4DwLFVG3U8ziFa/LBv7lB4cN4iHkO

                      jCRKCiN2Gy+Eji7E2JcEWTceOa7jy5gz8vcGEphiB8grn3bAYj6Iqvtle/OzCGar

                      yonSuk2+PVewhMjLSFVK5jwcHMp6sgYme7k2c5lKClrgn7QDpWxN0GUWX4vx/CMn

                      Rt/76KCzfGCAOUk4LsCsBgfPJ2UwUifJ5wVA+MPSTWifyyqhL9iioqrnvtvZ+7GT

                      yQIDAQAB

                      -----END PUBLIC KEY-----'
                    kty: RSA
      tags:
      - JWKS
      summary: Jwks
      x-summary-source: derived
components:
  schemas:
    JWKSResponse:
      type: object
      properties:
        x5c:
          type: array
          items:
            type: string
          description: The x509 certificate chain
        n:
          type: string
          format: bytes
          description: Pem moduluos
        e:
          type: string
          format: bytes
          description: PEM exponent
        alg:
          type: string
          description: The algorithm for the key
        kty:
          type: string
          description: Key type
        use:
          type: string
          description: How the key is meant to be used
x-refined-from:
- claroty-jwthenticator-openapi.yaml
- claroty-jwthenticator-openapi.yml
