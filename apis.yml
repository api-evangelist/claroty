aid: claroty

name: Claroty

description: Claroty is a cybersecurity company that protects cyber-physical systems (CPS) across industrial, healthcare, commercial, and public-sector
  environments. Its AI-powered platform delivers asset discovery, exposure and vulnerability management, threat detection, and secure remote access
  for operational technology (OT), IoT, and the extended internet of things (XIoT) that traditional IT security tools cannot adequately protect.
  Claroty serves more than 1,300 customers across 60+ countries, including 24 of the Fortune 100, and its Team82 research group publishes original
  vulnerability research and open-source ICS security tooling. This profile was seeded as a venture-portfolio lead and enriched by the API Evangelist
  pipeline; Claroty publishes no public product API or developer portal, so enrichment is limited to company identity, GitHub open-source presence,
  and security/compliance posture.

